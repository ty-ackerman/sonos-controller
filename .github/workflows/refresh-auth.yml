name: Refresh Sonos Authentication

# SWITCHED OFF (2026-11-06): the nightly schedule was removed on purpose.
# The app now refreshes each location's Sonos login itself every time it is used, and this job had
# been failing every night (and was then disabled by GitHub for inactivity) without anyone noticing.
# It can still be run by hand from the Actions tab if a location ever needs a fresh login.
on:
  workflow_dispatch:

jobs:
  refresh-auth:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Run authentication refresh
        env:
          SONOS_EMAIL_COLLEGE: ${{ secrets.SONOS_EMAIL_COLLEGE }}
          SONOS_PASSWORD_COLLEGE: ${{ secrets.SONOS_PASSWORD_COLLEGE }}
          SONOS_EMAIL_LESLIEVILLE: ${{ secrets.SONOS_EMAIL_LESLIEVILLE }}
          SONOS_PASSWORD_LESLIEVILLE: ${{ secrets.SONOS_PASSWORD_LESLIEVILLE }}
          APP_URL: https://sonos-controller.netlify.app
        run: node scripts/refresh-auth.js

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Authentication refresh completed successfully"
          else
            echo "❌ Authentication refresh failed"
          fi
